# Builds the web version and publishes it to GitHub Pages: https://huntermac.github.io/konekton/
# Repository settings: Pages source "GitHub Actions"; variable GOOGLE_CLIENT_ID (the OAuth client ID is public, not a secret).
name: Deploy web version to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:web
        env:
          KONEKTON_BASE: /konekton/
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-web

  # A job of its own: in the same job, deploy-pages sometimes looks before the artifact is listed ("No artifacts named github-pages").
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
